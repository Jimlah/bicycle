<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Émonda 56 · every part</title>
<style>
  :root{
    --ink:#e9e6df; --dim:#9aa3ad; --faint:#6b7480;
    --panel:rgba(14,17,22,.78); --line:rgba(255,255,255,.09);
    --accent:#ff5a36; --accent-soft:rgba(255,90,54,.16);
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#08090b;color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 8%,rgba(255,255,255,.055),transparent 62%),
               radial-gradient(100% 100% at 50% 100%,rgba(0,0,0,.55),transparent 60%)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 18px 50px rgba(0,0,0,.45)}

  header{position:fixed;top:18px;left:22px;right:22px;display:flex;align-items:flex-start;
    justify-content:space-between;gap:24px;pointer-events:none}
  .brand h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:600;text-transform:uppercase}
  .brand h1 span{color:var(--accent)}
  .brand p{margin:5px 0 0;color:var(--dim);font-size:12px;letter-spacing:.02em;max-width:52ch}
  .stats{display:flex;gap:26px;padding:10px 16px}
  .stat{text-align:right}
  .stat b{display:block;font:600 17px/1.1 var(--mono);letter-spacing:-.02em}
  .stat i{display:block;margin-top:3px;color:var(--faint);font-style:normal;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase}

  #parts{position:fixed;left:22px;top:104px;bottom:96px;width:286px;display:flex;flex-direction:column;overflow:hidden}
  #parts .head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
    border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  #parts .head button{all:unset;cursor:pointer;color:var(--dim);font-size:10px;letter-spacing:.12em}
  #parts .head button:hover{color:var(--ink)}
  #partlist{overflow:auto;padding:6px 6px 12px;scrollbar-width:thin;scrollbar-color:#2a3037 transparent}
  #partlist::-webkit-scrollbar{width:8px}
  #partlist::-webkit-scrollbar-thumb{background:#252b32;border-radius:8px}
  .group{margin:8px 0 2px}
  .group h3{margin:6px 8px 4px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);display:flex;justify-content:space-between;cursor:pointer;user-select:none}
  .group h3 em{font-style:normal;color:#404750}
  .row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;
    color:#c9cfd6;font-size:12.5px;line-height:1.3}
  .row:hover{background:rgba(255,255,255,.05)}
  .row.sel{background:var(--accent-soft);color:#fff}
  .row .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ms{font:10.5px var(--mono);color:var(--faint);flex:none}
  .row.off{opacity:.34}
  .row.off .nm{text-decoration:line-through}

  #card{position:fixed;right:22px;top:104px;width:308px;padding:16px 18px;opacity:0;
    transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none}
  #card.on{opacity:1;transform:none;pointer-events:auto}
  #card .kick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  #card h2{margin:6px 0 2px;font-size:17px;font-weight:600;letter-spacing:.01em}
  #card .mass{font:12px var(--mono);color:var(--dim);margin-bottom:12px}
  #card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px}
  #card dt{color:var(--faint);white-space:nowrap}
  #card dd{margin:0;text-align:right;color:#d6dbe1}
  #card .acts{display:flex;gap:8px;margin-top:14px}
  #card .acts button{flex:1}

  .btn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 11px;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cfd5dc;text-align:center;
    transition:background .15s,color .15s,border-color .15s;user-select:none}
  .btn:hover{background:rgba(255,255,255,.07);color:#fff}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#140806}

  #dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;
    gap:8px;padding:9px;border-radius:14px;max-width:calc(100vw - 40px);flex-wrap:wrap;justify-content:center}
  #dock .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  #explodeWrap{display:flex;align-items:center;gap:9px;padding:0 8px}
  #explodeWrap label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:3px;border-radius:3px;
    background:#2b323a;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px rgba(255,90,54,.16)}

  #tip{position:fixed;pointer-events:none;padding:4px 8px;border-radius:6px;background:rgba(8,9,11,.86);
    border:1px solid var(--line);font-size:11.5px;color:#e6e9ec;opacity:0;transform:translate(-50%,-140%);
    transition:opacity .1s;white-space:nowrap;z-index:5}

  .dims{position:fixed;inset:0;pointer-events:none}
  .dim{position:absolute;transform:translate(-50%,-50%);font:11px var(--mono);color:#dfe5ec;
    background:rgba(8,9,11,.7);border:1px solid var(--line);border-radius:5px;padding:2px 7px;white-space:nowrap}

  #modal{position:fixed;inset:0;background:rgba(4,5,7,.72);backdrop-filter:blur(6px);display:none;
    align-items:center;justify-content:center;z-index:20;padding:36px}
  #modal.on{display:flex}
  #sheet{width:min(980px,100%);max-height:84vh;overflow:auto;padding:28px 32px;border-radius:16px;
    background:#0d1015;border:1px solid var(--line)}
  #sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:.02em}
  #sheet p.sub{margin:0 0 22px;color:var(--dim);font-size:12.5px}
  #sheet h3{margin:24px 0 10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;vertical-align:top}
  th{color:var(--faint);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
  td.n{font-family:var(--mono);color:#d9e0e7;text-align:right;white-space:nowrap}
  #sheet a{color:#8fb8ff;text-decoration:none}
  #sheet a:hover{text-decoration:underline}
  #close{position:absolute;top:18px;right:22px}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#08090b;z-index:30;flex-direction:column;gap:14px;transition:opacity .5s}
  .loading.done{opacity:0;pointer-events:none}
  .loading .bar{width:170px;height:2px;background:#1c2127;overflow:hidden;border-radius:2px}
  .loading .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  .loading span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  #hud{position:fixed;right:22px;bottom:104px;display:none;gap:26px;align-items:flex-end;padding:12px 18px;
    border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px)}
  #hud.on{display:flex}
  #hud div{display:flex;flex-direction:column;align-items:flex-end}
  #hud b{font:600 22px/1 var(--mono);letter-spacing:-.03em}
  #hud i{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:4px}
  #hud .keys{flex-direction:row;gap:6px;align-items:center;font-size:10.5px;color:var(--dim);
    border-left:1px solid var(--line);padding-left:20px;margin-left:4px}
  #hud .keys span{display:inline-block;padding:2px 5px;border:1px solid var(--line);border-radius:4px;
    font-family:var(--mono);font-size:10px;color:#cfd5dc}
  #hint{position:fixed;left:50%;bottom:196px;transform:translateX(-50%);font-size:11px;color:var(--dim);
    opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.02em}
  #hint.on{opacity:.9}
  @media (max-width:1080px){
    #parts{width:230px} #card{display:none}
  }
  @media (max-width:760px){
    #parts{display:none} .brand p{display:none}
    .stats{gap:16px;padding:8px 12px} .stat b{font-size:14px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>

<header>
  <div class="brand">
    <h1>Émonda <span>56</span></h1>
    <p id="sub">Every part modelled with @classcad/smlibpy-three on the SMLib kernel</p>
  </div>
  <div class="stats panel" id="stats"></div>
</header>

<aside id="parts" class="panel">
  <div class="head"><span>Parts</span><button id="allOn">show all</button></div>
  <div id="partlist"></div>
</aside>

<section id="card" class="panel">
  <div class="kick" id="cardKick"></div>
  <h2 id="cardName"></h2>
  <div class="mass" id="cardMass"></div>
  <dl id="cardSpec"></dl>
  <div class="acts">
    <button class="btn" id="isoBtn">Isolate</button>
    <button class="btn" id="hideBtn">Hide</button>
  </div>
</section>

<div id="dock" class="panel">
  <div id="explodeWrap"><label>Explode</label><input type="range" id="explode" min="0" max="100" value="0"></div>
  <div class="sep"></div>
  <button class="btn" data-view="iso">3/4</button>
  <button class="btn" data-view="side">Side</button>
  <button class="btn" data-view="front">Front</button>
  <button class="btn" data-view="top">Top</button>
  <div class="sep"></div>
  <button class="btn" id="spinBtn">Spin</button>
  <button class="btn" id="xrayBtn">X-ray</button>
  <button class="btn" id="wireBtn">Wire</button>
  <button class="btn" id="dimBtn">Dims</button>
  <button class="btn" id="shotBtn">PNG</button>
  <button class="btn" id="specBtn">Spec</button>
</div>

<div id="tip"></div>
<div class="dims" id="dimlayer"></div>

<div id="modal">
  <div id="sheet">
    <button class="btn" id="close" style="position:fixed">Close</button>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="loading" id="loading">
  <div class="bar"><i></i></div>
  <span>decoding geometry</span>
</div>

<script type="text/plain" id="src-three-core">/*__THREE_CORE__*/</script>
<script type="text/plain" id="src-three-module">/*__THREE_MODULE__*/</script>
<script type="text/plain" id="src-rapier">/*__RAPIER__*/</script>

<script type="module">
const META = /*__META__*/;
const B64 = /*__B64__*/;

async function gunzipText(id) {
  const b64 = document.getElementById(id).textContent.trim();
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}
const coreURL = URL.createObjectURL(new Blob([await gunzipText('src-three-core')], { type: 'text/javascript' }));
const moduleSrc = (await gunzipText('src-three-module')).split("'./three.core.js'").join(JSON.stringify(coreURL));
const THREE = await import(URL.createObjectURL(new Blob([moduleSrc], { type: 'text/javascript' })));
const rapierModule = await import(URL.createObjectURL(new Blob([await gunzipText('src-rapier')], { type: 'text/javascript' })));
const RAPIER = rapierModule.default ?? rapierModule;
await RAPIER.init();

/*__APP__*/
</script>
</body>
</html>
